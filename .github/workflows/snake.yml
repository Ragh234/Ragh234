name: Generate Profile Assets

on:
  schedule:
    # runs once a day at 00:17 UTC — offset from the hour so it doesn't
    # queue behind everyone else's midnight cron jobs
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: Ragh234
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Stats cards are fetched here at build time and committed as static
      # files instead of embedding a live third-party URL in the README.
      # This avoids the GitHub camo proxy timing out on a cold-started
      # serverless function whenever someone views the profile.
      - name: Fetch GitHub stats card
        run: |
          curl -fsSL "https://github-stats-extended.vercel.app/api?username=Ragh234&show_icons=true&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=39FF14&icon_color=39FF14&text_color=c9d1d9" -o dist/stats.svg
          curl -fsSL "https://github-stats-extended.vercel.app/api/top-langs/?username=Ragh234&layout=compact&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=39FF14&text_color=c9d1d9" -o dist/top-langs.svg

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
